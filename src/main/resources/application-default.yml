server:
  port: 8080

spring:
#  jpa:
#    hibernate.dialect: org.hibernate.dialect.MySQL8Dialect
  kafka:
    producer:
      bootstrap-servers: kafka-0.kafka-svc.default.svc.cluster.local:9094,kafka-1.kafka-svc.default.svc.cluster.local:9094,kafka-2.kafka-svc.default.svc.cluster.local:9094
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      bootstrap-servers: kafka-0.kafka-svc.default.svc.cluster.local:9094,kafka-1.kafka-svc.default.svc.cluster.local:9094,kafka-2.kafka-svc.default.svc.cluster.local:9094
      group-id: order-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      auto-offset-reset: earliest
      properties:
        schema:
          registry:
            url: "http://schema-registry-service:8081"
      specific:
        avro:
          reader: true
    listener:
      concurrency: 3
    bootstrap-servers: kafka-0.kafka-svc.default.svc.cluster.local:9094,kafka-1.kafka-svc.default.svc.cluster.local:9094,kafka-2.kafka-svc.default.svc.cluster.local:9094

